<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1f26" media="(prefers-color-scheme: dark)">
<title>Teksti-TV</title>
<meta name="description" content="Yle Teksti-TV selaimessa ja asennettavana sovelluksena.">
<link rel="preconnect" href="https://external.api.yle.fi" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script>
  (function () {
    try {
      var saved = JSON.parse(localStorage.getItem("tekstitv:theme"));
      var theme =
        saved === "light" || saved === "dark"
          ? saved
          : matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
      document.documentElement.dataset.theme = theme;
    } catch (e) {}
  })();
</script>
</head>
<body>
<header class="topbar" id="topbar">
  <div class="bookmarks-row" id="bookmarks-row" hidden>
    <div class="bookmarks" id="bookmarks"></div>
    <button class="bar-button" id="bookmarks-menu-button" type="button" popovertarget="bookmarks-menu" aria-label="" hidden>⋯</button>
    <div class="bookmarks-menu" id="bookmarks-menu" popover></div>
  </div>
  <div class="topbar__actions">
    <button class="bar-button" id="zoom-out-button" type="button" aria-label="">−</button>
    <button class="bar-button zoom-reset" id="zoom-reset-button" type="button" aria-label="">100%</button>
    <button class="bar-button" id="zoom-in-button" type="button" aria-label="">+</button>
    <button class="bar-button" id="settings-button" type="button">⚙</button>
  </div>
</header>

<main class="viewer-wrap">
  <div class="viewer" id="viewer"></div>
  <p class="status" id="status" hidden></p>
</main>

<nav class="bottombar" id="bottombar">
  <button class="bar-button" id="refresh-button" type="button">⟳</button>
  <button class="bar-button" id="favorite-button" type="button" aria-label="" disabled>☆</button>
  <form class="bottombar__goto" id="goto-form">
    <input
      class="bottombar__input"
      id="goto-input"
      type="text"
      inputmode="numeric"
      pattern="[1-8][0-9]{2}"
      maxlength="3"
      autocomplete="off"
      enterkeyhint="go"
      placeholder="100"
    >
  </form>
  <button class="bar-button" id="prev-page-button" type="button" aria-label="">‹</button>
  <button class="bar-button" id="next-page-button" type="button" aria-label="">›</button>
</nav>

<dialog class="settings" id="settings-dialog">
  <form method="dialog">
    <header class="settings__header">
      <h2 data-i18n="settings">Asetukset</h2>
      <button class="settings__close" id="settings-close-button" type="submit">✕</button>
    </header>

    <fieldset class="settings__group">
      <legend data-i18n="language">Kieli</legend>
      <div class="settings__segmented" id="language-options">
        <button type="button" class="settings__segment" data-value="fi">Suomi</button>
        <button type="button" class="settings__segment" data-value="en">English</button>
      </div>
    </fieldset>

    <fieldset class="settings__group">
      <legend data-i18n="theme">Teema</legend>
      <div class="settings__segmented" id="theme-options">
        <button type="button" class="settings__segment" data-value="auto">
          <span aria-hidden="true">◐</span> <span data-i18n="themeAuto">Automaattinen</span>
        </button>
        <button type="button" class="settings__segment" data-value="light">
          <span aria-hidden="true">☀</span> <span data-i18n="themeLight">Vaalea</span>
        </button>
        <button type="button" class="settings__segment" data-value="dark">
          <span aria-hidden="true">☾</span> <span data-i18n="themeDark">Tumma</span>
        </button>
      </div>
    </fieldset>

    <a
      class="settings__source"
      href="https://yle.fi/tekstitv"
      target="_blank"
      rel="noopener"
      data-i18n="source"
    >Lähde: Yle Teksti-TV</a>
  </form>
</dialog>

<script type="module" src="js/main.js"></script>
</body>
</html>
